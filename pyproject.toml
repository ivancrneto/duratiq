[project]
name = "duratiq"
version = "0.2.0"
description = "Durable workflows for Dramatiq — Temporal-style durable execution on your existing Dramatiq + Postgres stack."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ivan Neto", email = "ivan.cr.neto@gmail.com" }]
keywords = [
    "dramatiq",
    "durable-execution",
    "workflow",
    "workflows",
    "orchestration",
    "temporal",
    "saga",
    "postgres",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/ivancrneto/duratiq"
Repository = "https://github.com/ivancrneto/duratiq"
Issues = "https://github.com/ivancrneto/duratiq/issues"
Changelog = "https://github.com/ivancrneto/duratiq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dramatiq = ["dramatiq>=1.16"]
redis = ["dramatiq>=1.16", "redis>=5"]
postgres = ["psycopg[binary]>=3.1"]
migrations = ["alembic>=1.13"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# Everything the runnable examples/ need (postgres_dramatiq.py: Postgres + Redis broker).
examples = ["dramatiq>=1.16", "redis>=5", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "dramatiq>=1.16", "alembic>=1.13", "opentelemetry-sdk>=1.20", "ty==0.0.100"]

[project.scripts]
# Periodic timer / schedule / recovery scanner. Point it at a 'module:callable'
# that returns a configured Engine, e.g. `duratiq-scanner myapp.workers:make_engine`.
duratiq-scanner = "duratiq.scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duratiq"]
# Ship non-.py package data: the Alembic script template and the PEP 561 typing marker.
artifacts = [
    "src/duratiq/migrations/script.py.mako",
    "src/duratiq/py.typed",
]

# Scope the sdist explicitly so it's deterministic and minimal — never sweeping in
# local working-tree state (node_modules, .claude, build artifacts) that the default
# whole-directory sdist would otherwise include. `only-include` restricts the walk to
# exactly these paths (pyproject.toml is always included).
[tool.hatch.build.targets.sdist]
only-include = [
    "src/duratiq",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "alembic.ini",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests (real worker threads, subprocesses, wall-clock time; slower). Deselect with -m 'not e2e'.",
]

[tool.coverage.run]
source = ["duratiq"]
branch = true

[tool.coverage.report]
# Regression gate. With branch coverage the suite sits at ~92%; 90% leaves headroom
# for the scanner's run-forever loop / CLI entry point, which aren't unit-tested.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Defaults (E4/E7/E9/F) plus the families that catch real bugs in this codebase.
extend-select = [
    "E",    # pycodestyle errors (full set, incl. E501 for strings/comments the formatter can't wrap)
    "W",    # pycodestyle warnings
    "I",    # isort: deterministic import order
    "B",    # flake8-bugbear: mutable defaults, loop-variable closures, zip() without strict=, ...
    "UP",   # pyupgrade: modern syntax for the minimum supported Python (3.10)
    "C4",   # flake8-comprehensions
    "BLE",  # a blind `except Exception` must be deliberate (noqa + reason)
    "DTZ",  # naive datetimes: a durable-timer engine must stay timezone-aware
    "T20",  # no stray print() in library code
    "ANN",  # every library def annotated; tests/examples exempt
    "RUF",  # ruff-specific, incl. RUF100: flag stale `# noqa` comments
]
ignore = [
    "UP038",  # isinstance(x, A | B) is slower than a tuple and the rule is deprecated upstream
    "ANN401", # `Any` is the honest type for user payloads, workflow args and results
]

[tool.ruff.lint.per-file-ignores]
# Runnable demos, tests and helper scripts talk to the user via print() and don't
# need the full annotations required of library code.
"examples/**" = ["T20", "ANN"]
"tests/**" = ["T20", "ANN"]
"scripts/**" = ["T20"]
"admin/backend/scripts/**" = ["T20", "ANN"]
"admin/backend/tests/**" = ["T20", "ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in an argument default by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ty]
# Single source of truth for the pre-commit hook, the CI `typecheck` job and a bare
# local `ty check`.

[tool.ty.src]
include = ["src/duratiq"]

[tool.ty.environment]
# Check against the oldest supported Python, so 3.11+-only syntax/APIs are caught.
python-version = "3.10"

[tool.ty.terminal]
# Warnings (deprecated APIs, unused `ty: ignore` comments, ...) fail the check too.
error-on-warning = true

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
