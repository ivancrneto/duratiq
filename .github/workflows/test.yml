name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # The end-to-end suite against a real PostgreSQL: the advisory-lock run
  # serialisation, concurrent Dramatiq workers, and the Alembic migrations only
  # exist (or only matter) there. Without DURATIQ_TEST_DATABASE_URL those tests skip.
  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duratiq
          POSTGRES_PASSWORD: duratiq
          POSTGRES_DB: duratiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duratiq -d duratiq_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DURATIQ_TEST_DATABASE_URL: postgresql+psycopg://duratiq:duratiq@localhost:5432/duratiq_test

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run end-to-end tests on PostgreSQL
        run: pytest tests/e2e -v -m e2e
