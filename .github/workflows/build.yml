name: build

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # run on merge-queue entries, so required checks report there too

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata (PyPI render)
        run: python -m twine check dist/*

      - name: Verify the wheel ships its data files
        run: |
          wheel=$(ls dist/*.whl)
          contents=$(python -m zipfile -l "$wheel")
          for f in duratiq/py.typed duratiq/migrations/script.py.mako; do
            echo "$contents" | grep -q "$f" || { echo "missing from wheel: $f"; exit 1; }
          done
          echo "wheel contents OK"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
