name: admin

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install duratiq + the admin backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .                  # duratiq (satisfies the admin's dep)
          python -m pip install -e "./admin/backend[dev]"

      - name: Run admin backend tests
        run: pytest -v
        working-directory: admin/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin/frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: admin/frontend
